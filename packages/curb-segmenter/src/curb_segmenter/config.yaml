# ==============================================================================
# Configuration File for Curb Segmentation Pipeline
# ==============================================================================
# This YAML file defines all parameters and settings required to run the curb
# segmentation workflow. It provides centralized control over data input paths,
# preprocessing options, required parameters, inference thresholds, and output
# specifications.
#
#
# Modify these parameters as needed for different datasets and environments.
# All paths should be absolute or relative to the project root.
# ==============================================================================

# Project settings
process_name: "curb-segmentation-pipline"
proj_crs: "epsg:2249"  # Distance unit in US Survey Feet

# Debug mode (Set this to True for debugging) True does not write to DB.
debug_mode: False

# PostgreSQL database settings
dbname: "cds"
schema: "staging_next"

# PostgreSQL export settings for curb segments
cs_job_name: "Merged tiny segments and list merged locations."
cs_job_description: "Merged tiny segments and added upstream_loc_list and downstream_loc_list to store the list of locations that are merged into the curb segment."

# Blockface table specification
bf_table_name: "curb_blockfaces"
bf_geom_col: "geography"
bf_job_id: "28285759-9601-4768-a9d2-5cf8a7bed2e0"

# Sign and nonsign asset table specification
assets:
  sign_assets:
    parking_sign:
      new_id_col: "ps_id"
      job_id: "06e098ea-9a51-45f4-b782-2efa8fd07a07"
  nonsign_assets:
    bus_stop:
      new_id_col: "bs_id"
      job_id: "223c3644-f0cd-4d28-877b-8ffa056cc2fe"
      stop_types:
        near_side:
          range: [ 0.7, 1.0 ]
          inclusive: True
          buffer_multiplier: -1.0
        far_side:
          range: [ 0.0, 0.3 ]
          inclusive: True
          buffer_multiplier: 1.0
        mid_block:
          range: [ 0.3, 0.7 ]
          inclusive: False
          buffer_multiplier: -1.0
    fire_hydrant:
      new_id_col: "fh_id"
      job_id: "e9e630af-2e20-4221-873a-890bb3477646"
      buffer_distance_ft: 10

# Process parameters
curb_id_col: "blockface_id"
min_curb_len_ft: 1
eps_fraction: 1e-6
snap_tolerance_ft: 30
min_segment_len_ft: 0.5
tiny_seg_threshold_ft: 3

# Local export settings
# =====================
# Directories
proj_dir: "./"
final_output_dir: "../final-outputs"

# Output settings
output_file_name: "curb_segments"
output_file_format: "GeoJSON"
output_crs: "epsg:4326"
