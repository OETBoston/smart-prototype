# database settings
db_name: "cds"
staging_db_schema: staging_demo # source data schema
api_db_schema: public_cds_demo # target api schema

# Source job ids
source_jobs:
  curb-segmenter: 27c19c05-c820-4799-bb81-c8427b8fef7f
  policy-handler: 3d7fa2a5-29b6-4132-9add-f36082b84108

# Number of simultaneous Gemini calls to allow. Defaults to 50.
gemini_concurrent_limit: 50

# Gemini model settings (Description Generation)
gemini_description_settings:
  model: "gemini-3.1-flash-lite-preview"
  thinking_level: null
  temperature: 0.1 # Must be from 0 to 2 (inclusive)
  mock_ai: False # For debugging, mock the AI call instead of running it
