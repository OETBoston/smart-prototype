[project]
name = "api_update"
version = "0.1.0"
description = "Staging to API Process for updating CDS policies in the database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "curb-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_update"]