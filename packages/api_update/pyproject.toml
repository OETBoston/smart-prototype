[project]
name = "api-update"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "google-cloud-bigquery>=3.0.0",
    "geopandas>=0.14.0",
    "pytest",
    "pydantic",
    "pydantic_settings",
    "fsspec",
    "gcsfs",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.3",
]

[tool.uv.sources]
smart-curb-db = { git = "https://github.com/OETBoston/smart-curb-db.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests that require live Google Cloud resources (slow/expensive)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake-8-annotations
    "ANN",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
ignore = [
    # # Type annotations required for self
    "ANN001",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

# [tool.setuptools.packages.find]
# where = ["."]
# include = ["utilities*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_update"]
