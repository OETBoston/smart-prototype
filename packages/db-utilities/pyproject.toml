[project]
name = "db-utilities"
version = "0.1.0"
description = "Tools for reading and writing from the smart-curb database"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "geoalchemy2>=0.18.1",
    "geopandas>=1.1.2",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_utils"]