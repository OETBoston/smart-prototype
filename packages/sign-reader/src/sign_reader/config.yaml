# Configuration for sign reader


# Debug mode (Set this to True for debugging) True does not write to DB.
debug_mode: False
max_images: null # For debugging - run only the first n images. Omit or set to null to run all images

# Gemini model settings
gemini_settings:
  model: "gemini-3-flash-preview"
  thinking_level: "low"
  temperature: 0 # Must be from 0 to 2 (inclusive)

# PostgreSQL database settings
db_name: "cds"
db_schema: "staging_next"

# Sign source data settings
sign_assets:
  job_id: null # Include a sign job ID to filter, or null/omit to run for all signs
  re_process: True # True to re-process signs that already have policies. Defaults to False.

# PostgreSQL export settings for curb segments
# Both are OPTIONAL - but a description is recommended.
# sr_job_name: "Charlestown Test (subset)"
sr_job_description: "Test run"