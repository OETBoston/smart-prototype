[project]
name = "sign-reader"
version = "0.1.0"
description = "Read signs with AI and generate CDS policies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.66.0",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.3",
    "pydantic-core>=2.41.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "toml>=0.10.2",
    "google-cloud-storage>=3.6.0",
    "rich",
    "curb-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sign_reader"]