    "folium>=0.20.0",
    "streamlit-folium>=0.26.1",
    "google-cloud-storage>=3.8.0",
    "dummylog>=0.0.4",
    "rich",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
