[project]
name = "data-utilities"
version = "0.1.0"
description = "Utilities to work with cloud data"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "google-cloud-bigquery>=3.0.0",
    "geopandas>=0.14.0",
    "pytest",
    "pydantic",
    "pydantic-settings",
    "fsspec",
"gcsfs",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests that require live Google Cloud resources (slow/expensive)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_utilities"]