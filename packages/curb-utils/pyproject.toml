[project]
name = "curb-utils"
version = "0.1.0"
description = "Shared utilities for use with the smart-curb project"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fsspec",
    "gcsfs",
    "geoalchemy2>=0.18.1",
    "geopandas>=1.1.2",
    "google-cloud-bigquery>=3.0.0",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic",
    "pydantic-settings",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curb_utils"]

[dependency-groups]
dev = [
    "ipython>=9.12.0",
]
