# ==============================================================================
# Configuration File for Sign Loader
# ==============================================================================
# This YAML file defines all parameters and settings required to run the
# Sign Loader workflow. It provides centralized control over data input paths,
# preprocessing options, required parameters, inference thresholds, and output
# specifications.
#
#
# Modify these parameters as needed for different datasets and environments.
# All paths should be absolute or relative to the project root.
# ==============================================================================

# Database settings
dbname: "cds"
schema: "seaport_cds"
job_name: "seaport-survey123"
job_description: "Seaport Sign Survey (Survey123) import from the authoritative parent GlobalID export, excluding driveway records"

# Data source selector. One of:
#   "Cartegraph" -> Cartegraph CSV export (see cartegraph_required_columns below)
#   "survey123" / "arcgis" -> ArcGIS Online / Survey123 feature service (see survey123 below)
#   anything else -> generic geospatial file (see other_data_source below)
data_source_name: "survey123"

# Debug mode (Set this to True for debugging) True does not write to DB.
debug_mode: False
signs_path: "data/boston-cartegraph.csv"
input_crs: "EPSG:4326"
output_crs: "EPSG:4326"

# ==============================================================================
# Survey123 / ArcGIS Online import settings (used when data_source_name is
# "survey123" or "arcgis").
# ==============================================================================
survey123:
  service_url: "https://services.arcgis.com/sFnw0xNflSi8J0uh/arcgis/rest/services/service_80d5dd0ee96e40f98b991a3234dabe00/FeatureServer"
  portal_url: "https://www.arcgis.com"

  # Layer ids are auto-discovered by name when left null.
  parent_layer_id: null
  repeat_layer_id: null
  parent_layer_name: "Form_2"
  repeat_layer_name: "sign_repeat"

  # Filter applied to the PARENT survey records (matches the Survey123
  # "0.CreationDate" filter). Repeat signs follow their matched parents.
  where: "1=1"
  # Optional separate filter for the repeat table (defaults to all signs).
  repeat_where: "1=1"
  parent_allowlist:
    csv_path: "inputs/seaport_survey123/parent_globalids.csv"
    csv_column: "GlobalID"
  exclude_sign_types:
    - "driveway"
  # Optional cap on the number of sign records (handy for testing). null = all.
  limit: null

  # Which layer holds the photo attachments: "auto" | "parent" | "repeat".
  attachments:
    link_level: "auto"
    max_workers: 8

  # Where to persist downloaded images. backend: "local" | "gcs".
  #   local -> writes to local_dir, stores the file path as images.uri
  #   gcs   -> writes to GCS_PREFIX (or prefix below) using GCS_TOKEN_PATH
  image_storage:
    backend: "local"
    local_dir: "inputs/survey_images/seaport"
    # prefix: "gs://your-bucket/boston/signs"  # overrides GCS_PREFIX when set

  # Optional overrides; left null these are auto-detected from the service.
  field_map:
    sign_type: "sign_type"
    added_date: "CreationDate"
    repeat_parent_field: null

  # Offline fallback: read the downloaded .shp/.dbf instead of the live service
  # (loads locations + signs only, no images).
  use_shapefile_fallback: false
  shapefile_dir: "inputs/shp-89b853514fd34317abf6f3c1857e0c00"
  parent_shapefile: "Form_2.shp"
  repeat_dbf: "sign_repeat.dbf"

# Columns in the input data
# Required columns if using Cartegraph input
cartegraph_required_columns:
  source_sign_id: "oid"
  source_image_id: "attachment_oid"
  uri: "attachment_public_url"
  sign_type_code: "mutcd_code_field"
  added_date: "entry_date_field"
  geometry_columns:
    - "latitude"
    - "longitude"
  date_columns:
    sign_modified_date: "cg_last_modified_field"
    attachment_modified_date: "attachment_cg_last_modified_field"

# Required columns if not using Cartegraph input
other_data_source:
  required_columns:
    geometry: "geometry_col"
    uri: "image_url_col"
  optional_columns:
    source_sign_id: None
    source_image_id: None
    notes_col: None

# Filter Cartegraph-related by columns and values. Mode can be one of:
#   "drop" (drop rows with these values).
#   "keep" (keep only rows with these values).
#   "starts_with" (drop rows where the column value starts with any of the specified values).
column_filters:
  - column: "asset_status_field"
    values: ["Missing", "Proposed"]
    mode: "drop"
  - column: "mutcd_code_field"
    values:
      [
        "P-",
        "MS-",
        "PB-",
        "S-",
        "AC-",
        "T-",
        "TS-",
        "TC-",
        "R7-107a",
        "R7-4",
        "R7-21",
      ]
    mode: "starts_with"

# Optionally, filter for signs within a specified geography using a GIS file.
# To include only a specific subset of the polygon data,
# set the subset_column and subset_values (array)
geo_filter:
  path: "data/boston_neighborhood_boundaries/Boston_Neighborhood_Boundaries.shp"
  crs: "EPSG:4326"
  subset_column: "name"
  subset_values: ["Charlestown"]

# Grouping parameters for clustering signs based on proximity.
grouping_parameters:
  grouping_distance_ft: 5
  grouping_crs: "EPSG:2249" # projected crs for measurement (unit should be US FT)
