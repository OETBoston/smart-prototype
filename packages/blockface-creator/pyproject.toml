[project]
name = "smart-curb-geometry-creation"
version = "0.1.0"
description = "Create curb line geometries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dummylog>=0.0.4",
    "geopandas>=1.1.1",
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "PyYAML>=6.0.3",
    "shapely>=2.1.2",
    "pyarrow>=22.0.0",
    "notebook>=7.5.2",
    "smart-curb-db",
    "folium>=0.20.0",
    "matplotlib>=3.10.8",
    "mapclassify>=2.10.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake-8-annotations
    "ANN",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
ignore = [
    # # Type annotations required for self
    "ANN001",
    # Dynamically typed expressions (Any) allowed for external library types
    "ANN401",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.pylint.messages_control]
max-line-length = 88

[tool.uv.sources]
smart-curb-db = { path = "../smart-curb-db" }
