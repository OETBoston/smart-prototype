[project]
name = "blockface-creator"
version = "0.1.0"
description = "Create curb line geometries"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "geopandas>=1.1.1",
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "PyYAML>=6.0.3",
    "shapely>=2.1.2",
    "pyarrow>=22.0.0",
    "notebook>=7.5.2",
    "folium>=0.20.0",
    "matplotlib>=3.10.8",
    "mapclassify>=2.10.0",
    "curb_utils",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockface_creator"]