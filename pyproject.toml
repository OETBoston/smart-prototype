[project]
name = "smart_prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests that require live Google Cloud resources (slow/expensive)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake-8-annotations
    "ANN",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
ignore = [
    # # Type annotations required for self
    "ANN001",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
